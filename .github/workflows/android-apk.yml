name: Android debug APK

on:
  push:
    branches:
      - 'audit/**'
  pull_request:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Remove local Termux-only Gradle paths
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' android/gradle.properties
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.auto-detect=/d' android/gradle.properties
          chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-ottico-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
