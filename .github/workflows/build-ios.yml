name: Build iOS Simulator

on:
  push:
    branches: [ "ios/iphone-support" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/ios@^8.5.2

      - name: Run checks
        run: |
          npm run lint
          npx vitest run --exclude=firestore.rules.test.ts
          npx vite build

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Studio Ottico Di Pietro usa la fotocamera per acquisire tessere e documenti." ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Studio Ottico Di Pietro usa la fotocamera per acquisire tessere e documenti." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Studio Ottico Di Pietro accede alle foto selezionate per importare documenti." ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Studio Ottico Di Pietro accede alle foto selezionate per importare documenti." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Studio Ottico Di Pietro salva le immagini esportate solo su richiesta." ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Studio Ottico Di Pietro salva le immagini esportate solo su richiesta." ios/App/App/Info.plist

      - name: Build iOS Simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app ../../../../../StudioOtticoDiPietro-iOS-Simulator.zip

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-ottico-ios-simulator
          path: StudioOtticoDiPietro-iOS-Simulator.zip
          if-no-files-found: error
