name: Validate app

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Firestore rules tests (emulator)
        run: |
          npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools
          npx firebase emulators:exec --only firestore --project demo-inventario-rules "node scripts/test-firestore-rules.mjs"
      - name: TypeScript check
        run: npm run lint
      - name: Build web app and server
        run: npm run build
