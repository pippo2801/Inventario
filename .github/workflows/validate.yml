name: Validate app

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app and server
        run: npm run build
