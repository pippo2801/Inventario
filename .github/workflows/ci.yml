name: CI Pipeline

on:
  push:
    branches: [main, audit/complete-project-fixes]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run lint

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests (excluding Firestore tests)
        run: npx vitest run --exclude=firestore.rules.test.ts

  firestore-rules-tests:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Firebase Emulator
        uses: firebase/emulators@v2
        with:
          firestore: true
          project_id: test-project
          start_options: --host=0.0.0.0 --port=8080

      - name: Wait for Firestore Emulator
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Firestore Emulator ready on port 8080"
              exit 0
            fi
            echo "Waiting for Firestore Emulator... ($i/30)"
            sleep 1
          done
          echo "Firestore Emulator failed to start"
          exit 1

      - name: Run Firestore rules tests
        run: npx vitest run firestore.rules.test.ts
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, firestore-rules-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist/

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add Android platform and build
        run: |
          npx @capacitor/cli sync android
          
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
